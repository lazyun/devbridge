<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dev Bridge</title>
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <div id="embedded-root" class="embedded-console-shell">
    <header class="embedded-toolbar">
      <div class="topbar-project" id="project-selector-slot"></div>
      <div id="session-filter-slot" class="embedded-session-filters"></div>
      <div class="health" aria-live="polite"><span id="health-dot" class="health-dot"></span><span id="health-text" data-i18n="health.connecting">Connecting</span></div>
      <div class="top-actions"><span id="last-sync" class="muted" data-i18n="sync.never">Not refreshed yet</span><button id="refresh" class="button secondary" type="button" data-i18n="action.refresh">Refresh</button></div>
    </header>
    <main id="main-content" class="embedded-main" tabindex="-1"><div id="page" aria-live="polite"></div></main>
    <div id="toast" class="toast hidden" role="status"></div>
  </div>
  <template id="console-shell">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skip">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="bridge-mark" aria-hidden="true">DB</span>
        <div><strong>Dev Bridge</strong><span data-i18n="app.console">Web Console</span></div>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation" data-i18n-aria="a11y.primaryNav">
        <button class="nav-item" type="button" data-product-nav="overview"><span class="nav-icon" aria-hidden="true">⌂</span><span data-i18n="project.overview">概览</span></button>
        <button class="nav-item" type="button" data-product-nav="featureAreas"><span class="nav-icon" aria-hidden="true">◇</span><span data-i18n="project.featureAreas">功能领域</span></button>
        <button class="nav-item" type="button" data-product-nav="tasks"><span class="nav-icon" aria-hidden="true">✓</span><span data-i18n="project.tasks">任务</span></button>
        <button class="nav-item" type="button" data-product-nav="sessions"><span class="nav-icon" aria-hidden="true">▷</span><span>运行会话</span></button>
        <button class="nav-item" type="button" data-product-nav="resources"><span class="nav-icon" aria-hidden="true">▤</span><span data-i18n="project.resources">项目资料</span></button>
        <button class="nav-item" type="button" data-product-nav="diagnostics"><span class="nav-icon" aria-hidden="true">⌁</span><span data-i18n="project.diagnostics">诊断</span></button>
      </nav>
      <div class="sidebar-foot">
        <label for="language-select" data-i18n="language.label">Language</label>
        <select id="language-select">
          <option value="system" data-i18n="language.system">System Default</option>
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-project" id="project-selector-slot"></div>
        <div class="topbar-development" id="development-selector-slot"></div>
        <div class="health" aria-live="polite"><span id="health-dot" class="health-dot"></span><span id="health-text" data-i18n="health.connecting">Connecting</span></div>
        <div class="top-actions"><button id="settings-open" class="button secondary" type="button" data-i18n="workbench.settings">设置</button><span id="last-sync" class="muted" data-i18n="sync.never">Not refreshed yet</span><button id="refresh" class="button secondary" type="button" data-i18n="action.refresh">Refresh</button></div>
      </header>
      <main id="main-content" tabindex="-1">
        <div id="page" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div id="detail-layer" class="detail-layer hidden">
    <button id="detail-backdrop" class="detail-backdrop" type="button" aria-label="Close details" data-i18n-aria="action.close"></button>
    <aside id="detail" class="detail" aria-live="polite" aria-label="Details" data-i18n-aria="details.title">
      <div class="detail-head"><h2 id="detail-title" data-i18n="details.title">Details</h2><button id="detail-close" class="icon-button" type="button" aria-label="Close details" data-i18n-aria="action.close">×</button></div>
      <div id="detail-body"></div>
    </aside>
  </div>
  <div id="result-modal" class="modal-layer hidden" role="dialog" aria-modal="true" aria-labelledby="result-modal-title">
    <button id="result-modal-backdrop" tabindex="-1" class="modal-backdrop" type="button" aria-label="Close full result" data-i18n-aria="action.closeFullResult"></button>
    <section class="result-modal">
      <div class="detail-head"><h2 id="result-modal-title" data-i18n="review.fullResult">Full Review result</h2><button id="result-modal-close" class="icon-button" type="button" aria-label="Close full result" data-i18n-aria="action.closeFullResult">×</button></div>
      <div id="result-modal-body" tabindex="0" class="result-modal-body"></div>
    </section>
  </div>
  <dialog id="retire-dialog" class="retire-dialog" aria-labelledby="retire-title" aria-describedby="retire-name retire-consequences">
    <h2 id="retire-title">关闭功能领域？</h2>
    <p id="retire-name"></p>
    <div id="retire-consequences"><p>关闭后：</p><ul><li>不再接受新的开发任务</li><li>如有活动工作，将按正式 cancellation/convergence 收口</li><li>该领域不会重新回到 ACTIVE</li></ul></div>
    <p id="retire-error" role="alert"></p>
    <div class="detail-actions"><button id="retire-cancel" class="button" type="button" autofocus>取消</button><button id="retire-confirm" class="button danger" type="button">确认关闭</button></div>
  </dialog>
  <dialog id="settings-dialog" class="retire-dialog" aria-labelledby="settings-title">
    <h2 id="settings-title" data-i18n="workbench.settings">设置</h2>
    <h3 data-i18n="workbench.projectSettings">项目设置</h3>
    <p data-i18n="workbench.settingsScope"></p>
    <button id="settings-repository" type="button" class="button" data-i18n="workbench.repositories">仓库信息</button>
    <button id="settings-close" type="button" class="button" data-i18n="action.close" autofocus>关闭</button>
  </dialog>
  <div id="toast" class="toast hidden" role="status"></div>
  </template>

  <script src="product-i18n.js" defer></script>
  <script src="product-status.js" defer></script>
  <script src="product-components.js" defer></script>
  <script src="product-logformat.js" defer></script>
  <script src="product-logview.js" defer></script>
  <script src="product-development.js" defer></script>
  <script src="product-work-refresh.js" defer></script>
  <script src="product-retire.js" defer></script>
  <script src="product-workbench.js" defer></script>
  <script src="product-task-workbench.js" defer></script>
  <script src="product-session-workbench.js" defer></script>
  <script src="product-app.js" defer></script>
</body>
</html>
