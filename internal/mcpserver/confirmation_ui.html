<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev Bridge · 操作确认</title>
<style id="confirmation-style">
/* DEV BRIDGE confirmation V5. Sole stylesheet: replace, never append to V1–V3. */
:root {
  color-scheme: light dark;
  --dbc-fg: var(--color-text-primary, #18243b);
  --dbc-muted: var(--color-text-secondary, #66758d);
  --dbc-surface: var(--color-background-primary, #fff);
  --dbc-soft: var(--color-background-secondary, #f8fafd);
  --dbc-border: #dce4f0;
  --dbc-line: #e8edf5;
  --dbc-accent: #1264e9;
  --dbc-accent-hover: #0954ce;
  --dbc-tint: #f0f5ff;
  --dbc-icon-bg: #eaf2ff;
  --dbc-area-fg: #6941b8;
  --dbc-area-bg: #f4efff;
  --dbc-area-border: #d9c9f5;
  --dbc-warning: #b65316;
  --dbc-warning-bg: #fff5eb;
  --dbc-warning-border: #ffd3ae;
  --dbc-danger: var(--color-text-danger, #ad252d);
  --dbc-focus: #2674ff;
  --dbc-shadow: 0 12px 34px rgb(23 43 76 / 8%), 0 2px 6px rgb(23 43 76 / 3%);
  --dbc-modal-shadow: 0 24px 68px rgb(19 35 65 / 22%);
  /* The unchanged reader controller writes these geometry variables. */
  --db-reader-width: 480px;
  --db-reader-height: 500px;
  --db-reader-left: 16px;
  --db-reader-top: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --dbc-fg: var(--color-text-primary, #e9eef8);
    --dbc-muted: var(--color-text-secondary, #a8b5cb);
    --dbc-surface: var(--color-background-primary, #1c2534);
    --dbc-soft: var(--color-background-secondary, #232e40);
    --dbc-border: #41506a;
    --dbc-line: #34435b;
    --dbc-accent: #73a9ff;
    --dbc-accent-hover: #93bbff;
    --dbc-tint: #24324b;
    --dbc-icon-bg: #293e60;
    --dbc-area-fg: #d3b8ff;
    --dbc-area-bg: #352b48;
    --dbc-area-border: #685184;
    --dbc-warning: #ffbd8c;
    --dbc-warning-bg: #3a2f28;
    --dbc-warning-border: #785638;
    --dbc-danger: var(--color-text-danger, #ffa1a8);
    --dbc-focus: #9bc2ff;
    --dbc-shadow: 0 12px 34px rgb(0 0 0 / 22%);
  }
}
/* Document geometry is deliberately minimal; no root viewport-height rules. */
html { margin: 0; padding: 0; background: transparent; }
body.dbc-surface {
  margin: 0;
  padding: 16px;
  background: transparent;
  color: var(--dbc-fg);
  font: 14px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
#db-confirmation-shell,
#db-confirmation-shell *,
#debug,
#debug *,
.db-plan-dialog,
.db-plan-dialog * { box-sizing: border-box; }
/* Stable shell: sizer/reader observe this node, not an unpadded host root. */
#db-confirmation-shell {
  position: relative;
  isolation: isolate;
  display: block;
  width: 100%;
  max-width: 820px;
  min-width: 0;
  margin: 0 auto;
  padding: 0;
  border: 1px solid var(--dbc-border);
  border-radius: 18px;
  background: var(--dbc-surface);
  box-shadow: var(--dbc-shadow);
}
/* Dedicated content wrapper defeats generic main/#root resets without !important. */
#db-confirmation-shell > #root.dbc-content {
  display: block;
  min-width: 0;
  width: 100%;
  margin: 0;
  padding: 26px 28px 24px;
  color: var(--dbc-fg);
  background: transparent;
  font: inherit;
}
#db-confirmation-shell :is(h1,h2,h3,p,dl,dd,ul,ol),
#debug :is(h1,h2,p) { margin: 0; }
#db-confirmation-shell :is(h1,h2,h3) { color: var(--dbc-fg); }
#db-confirmation-shell h1 { font-size: 21px; line-height: 1.42; font-weight: 730; letter-spacing: -.025em; overflow-wrap: anywhere; }
#db-confirmation-shell h2 { font-size: 15px; line-height: 1.5; font-weight: 660; }
#db-confirmation-shell h3 { font-size: 14px; line-height: 1.5; }
#db-confirmation-shell p { line-height: 1.65; overflow-wrap: anywhere; }
#db-confirmation-shell .muted { color: var(--dbc-muted); font-size: 12px; }
#db-confirmation-shell .error,
#debug .error,
.db-plan-dialog .error { color: var(--dbc-danger); overflow-wrap: anywhere; }
#db-confirmation-shell .notice { white-space: pre-wrap; overflow-wrap: anywhere; }
.dbc-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.dbc-brand-group { min-width: 0; flex: 1; }
.dbc-brand { display: block; font-size: 17px; letter-spacing: .08em; line-height: 1.35; font-weight: 750; }
#db-confirmation-shell .dbc-environment { margin-top: 7px; color: var(--dbc-muted); font-size: 13px; overflow-wrap: anywhere; }
.dbc-header-controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: flex-end; }
.dbc-status { display: inline-flex; gap: 6px; align-items: center; max-width: 220px; padding: 4px 11px; border: 1px solid var(--dbc-warning-border); border-radius: 999px; background: var(--dbc-warning-bg); color: var(--dbc-warning); font-size: 12px; line-height: 1.4; }
#root[data-state="COMPLETED"] .dbc-status { border-color: var(--dbc-border); background: var(--dbc-tint); color: var(--dbc-fg); }
.dbc-intro { margin-bottom: 18px; }
.dbc-purpose { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin-bottom: 14px; padding: 7px 13px; border: 1px solid var(--dbc-border); border-radius: 9px; background: var(--dbc-icon-bg); color: var(--dbc-accent); font-size: 15px; font-weight: 730; line-height: 1.5; }
.dbc-purpose[data-purpose="FEATURE_AREA"] { color: var(--dbc-area-fg); background: var(--dbc-area-bg); border-color: var(--dbc-area-border); }
.dbc-purpose > span { overflow-wrap: anywhere; min-width: 0; }
#db-confirmation-shell .dbc-initial-task { margin-top: 12px; padding: 10px 13px; border: 1px solid var(--dbc-line); border-radius: 9px; background: var(--dbc-soft); }
.dbc-initial-task > strong { display: block; margin-bottom: 3px; font-size: 13px; }
#db-confirmation-shell .dbc-eyebrow { font-size: 13px; color: var(--dbc-muted); margin-bottom: 7px; }
#db-confirmation-shell .engineering-summary { margin-top: 12px; font-size: 14px; color: var(--dbc-fg); line-height: 1.7; }
.dbc-callout { border: 1px solid var(--dbc-line); border-radius: 13px; padding: 18px; background: linear-gradient(110deg, var(--dbc-tint), var(--dbc-soft)); margin-bottom: 16px; }
.dbc-info-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 13px; align-items: start; }
.dbc-info-row + .dbc-info-row { margin-top: 18px; }
.dbc-info-body { min-width: 0; }
#db-confirmation-shell .dbc-info-body > p,
#db-confirmation-shell .dbc-info-body > ul { margin-top: 5px; color: var(--dbc-muted); font-size: 14px; }
#db-confirmation-shell .dbc-constraints { list-style: none; padding: 0; }
.dbc-constraints li + li { margin-top: 3px; }
.dbc-icon { width: 19px; height: 19px; display: block; flex: 0 0 auto; pointer-events: none; }
.dbc-icon-tile { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--dbc-accent); background: var(--dbc-icon-bg); }
.dbc-icon-tile .dbc-icon { width: 22px; height: 22px; }
.dbc-config { border: 1px solid var(--dbc-line); border-radius: 13px; padding: 18px; background: var(--dbc-surface); margin-top: 16px; }
.dbc-section-heading { display: flex; align-items: center; gap: 13px; margin-bottom: 12px; }
.dbc-config-content { margin-left: 49px; min-width: 0; }
.dbc-config-content > * + * { margin-top: 11px; }
#db-confirmation-shell .dbc-config-content .muted { margin-top: 8px; }
.dbc-fields { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 16px; margin-top: 15px; }
.dbc-field { display: flex; flex-direction: column; gap: 7px; min-width: 0; color: var(--dbc-fg); font-size: 13px; }
.dbc-field-label { font-weight: 520; }
.dbc-select-shell { position: relative; display: block; min-width: 0; }
#db-confirmation-shell select {
  display: block;
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  min-width: 0;
  min-height: 40px;
  padding: 8px 36px 8px 12px;
  margin: 0;
  border: 1px solid var(--dbc-border);
  border-radius: 9px;
  color: var(--dbc-fg);
  background: var(--dbc-surface);
  font: inherit;
  font-size: 14px;
  line-height: 1.45;
}
.dbc-select-shell > .dbc-icon { position: absolute; right: 11px; top: calc(50% - 8px); width: 16px; height: 16px; color: var(--dbc-muted); }
#db-confirmation-shell .dbc-fast { display: flex; align-items: center; gap: 9px; margin-top: 13px; font-size: 13px; cursor: pointer; }
#db-confirmation-shell input[type="checkbox"] { appearance: auto; width: 17px; height: 17px; margin: 0; flex: 0 0 auto; accent-color: #1264e9; }
#db-confirmation-shell dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 16px; font-size: 14px; }
#db-confirmation-shell dt { color: var(--dbc-muted); }
#db-confirmation-shell dd { min-width: 0; overflow-wrap: anywhere; }
#db-confirmation-shell .dbc-feedback:not(:empty) { margin-top: 14px; }
.dbc-feedback .error, .dbc-feedback .notice { padding: 9px 11px; border-inline-start: 3px solid var(--dbc-warning-border); background: var(--dbc-soft); border-radius: 5px; }
.dbc-feedback > * + * { margin-top: 7px; }
.dbc-feedback > [hidden] { display: none; }
#db-confirmation-shell .outcome { margin: 14px 0; padding: 13px 15px; border: 1px solid var(--dbc-line); border-radius: 10px; background: var(--dbc-soft); }
#db-confirmation-shell .outcome > * + * { margin-top: 7px; }
.dbc-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--dbc-line); }
.dbc-secondary-actions, .dbc-primary-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; }
.dbc-primary-actions { margin-inline-start: auto; }
#db-confirmation-shell button,
#debug button,
.db-plan-dialog button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; max-width: 100%; padding: 8px 13px; margin: 0;
  border: 1px solid var(--dbc-border); border-radius: 9px;
  background: var(--dbc-surface); color: var(--dbc-fg);
  font: inherit; font-size: 13px; line-height: 1.45; font-weight: 560;
  cursor: pointer; text-align: center; white-space: normal;
}
#db-confirmation-shell button:not(:disabled):hover,
#debug button:not(:disabled):hover,
.db-plan-dialog button:not(:disabled):hover { background: var(--dbc-soft); }
#db-confirmation-shell button.primary { border-color: #1264e9; background: #1264e9; color: #fff; box-shadow: 0 3px 7px rgb(18 100 233 / 15%); }
#db-confirmation-shell button.primary:not(:disabled):hover { background: #0954ce; border-color: #0954ce; }
#db-confirmation-shell button.dbc-outline { color: var(--dbc-accent); border-color: var(--dbc-accent); }
#db-confirmation-shell button.dbc-settings { border-color: transparent; background: transparent; min-height: 30px; padding: 1px 0; }
#db-confirmation-shell button:disabled,
#db-confirmation-shell select:disabled { opacity: .54; cursor: not-allowed; }
#db-confirmation-shell :is(button,select,input,a,[tabindex]):focus-visible,
#debug :is(button,textarea):focus-visible,
.db-plan-dialog :is(button,a,[tabindex]):focus-visible { outline: 2px solid var(--dbc-focus); outline-offset: 3px; }
.dbc-empty { padding: 14px 0 4px; color: var(--dbc-muted); }
#db-confirmation-shell textarea.copy { display: block; width: 100%; min-height: 90px; margin-top: 10px; border: 1px solid var(--dbc-border); border-radius: 8px; background: var(--dbc-soft); color: var(--dbc-fg); font: 12px/1.6 ui-monospace, monospace; }
/* Native reader. Existing immutable-content controller is preserved. */
dialog.db-plan-dialog {
  position: fixed; inset: auto;
  left: var(--db-reader-left); top: var(--db-reader-top);
  width: var(--db-reader-width); height: var(--db-reader-height);
  max-width: none; max-height: none; min-width: 0; min-height: 0;
  margin: 0; padding: 0; overflow: hidden;
  border: 1px solid var(--dbc-border); border-radius: 17px;
  background: var(--dbc-surface); color: var(--dbc-fg);
  box-shadow: var(--dbc-modal-shadow);
  font: 14px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
dialog.db-plan-dialog:not([open]), #debug:not([open]) { display: none; }
dialog.db-plan-dialog[open] { display: grid; grid-template-rows:auto auto auto minmax(0,1fr) auto; }
dialog.db-plan-dialog::backdrop, #debug::backdrop { background: rgb(23 37 62 / 28%); }
.db-plan-header { display: flex; align-items: flex-start; gap: 12px; padding: 19px 20px 15px; border-bottom: 1px solid var(--dbc-line); }
.db-plan-heading-group { flex: 1; min-width: 0; }
.db-plan-title { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 710; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db-plan-subtitle { margin: 7px 0 0; font-size: 12px; line-height: 1.5; color: var(--dbc-muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.db-plan-notice { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--dbc-warning); }
.db-plan-dialog .db-icon-button { flex: 0 0 auto; width: 34px; min-height: 34px; height: 34px; padding: 0; border-color: transparent; background: transparent; font-size: 25px; font-weight: 350; }
.db-plan-body { min-height: 0; min-width: 0; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: 19px 21px 24px; overflow-wrap: anywhere; outline-offset: -3px; }
.db-plan-feedback:not([hidden]) { margin: 0 0 17px; padding: 11px 13px; border: 1px solid var(--dbc-line); border-radius: 9px; background: var(--dbc-soft); }
.db-plan-feedback .outcome { margin: 9px 0; }
.db-plan-feedback p { margin: 5px 0; }
.overview-document h2,.structured-fields>.field-group>h2 {font-size:16px;line-height:1.5;margin:20px 0 10px;}
.overview-document h3 {font-size:14px;margin:16px 0 7px;}
.prompt-document h1 {font-size:21px;line-height:1.4;margin:26px 0 14px;font-weight:720;}
.prompt-document h2 {font-size:18px;line-height:1.5;margin:24px 0 11px;font-weight:670;}
.prompt-document h3 {font-size:15px;line-height:1.55;margin:20px 0 9px;font-weight:650;}
.prompt-document :is(h4,h5,h6) {font-size:14px;line-height:1.55;margin:16px 0 7px;}
.prompt-document>:is(h1,h2,h3):first-child {margin-top:0;}
.db-plan-content p { margin: 7px 0; }
.db-plan-content :is(ol,ul) { margin: 7px 0; padding-inline-start: 24px; }
.db-plan-content li { margin: 6px 0; }
.db-plan-content .document-section { margin: 15px 0; }
.db-plan-content .checks > li { padding: 7px 0 12px; }
.db-plan-content .checks > li + li { border-top: 1px solid var(--dbc-line); }
.db-plan-content pre { display: block; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; padding: 12px; border: 1px solid var(--dbc-line); border-radius: 9px; background: var(--dbc-soft); white-space: pre; }
.db-plan-content code { font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
.db-plan-content table { display: block; max-width: 100%; border-collapse: collapse; overflow-x: auto; font-size: 12px; }
.db-plan-content :is(td,th) { border: 1px solid var(--dbc-border); padding: 6px 9px; text-align: start; }
.db-plan-content a { color: var(--dbc-accent); }
.db-plan-content blockquote { margin-inline: 0; padding-inline-start: 12px; border-inline-start: 3px solid var(--dbc-border); color: var(--dbc-muted); }
.db-plan-content dl, .db-plan-feedback dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; }
.db-plan-content dd, .db-plan-feedback dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.db-plan-content dt, .db-plan-feedback dt { color: var(--dbc-muted); }
.db-plan-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 20px; border-top: 1px solid var(--dbc-line); background: var(--dbc-surface); }
.db-plan-help { color: var(--dbc-muted); font-size: 12px; }
.db-plan-dialog [hidden] { display: none !important; }
.db-plan-dialog[data-compact="true"] { grid-template-rows:auto auto auto minmax(0,1fr); }
.db-plan-dialog[data-compact="true"] .db-plan-subtitle,
.db-plan-dialog[data-compact="true"] .db-plan-footer { display: none; }
.db-plan-dialog[data-compact="true"] .db-plan-header { padding: 8px 10px; }
.db-plan-dialog[data-compact="true"] .db-plan-body { padding: 12px; }
.db-plan-dialog[data-compact="true"] .db-plan-notice { display: block; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.reader-tabs {display:flex;gap:4px;min-width:0;padding:6px 14px;border-bottom:1px solid var(--dbc-line);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;}
.reader-tabs .reader-tab {flex:0 0 auto;border-color:transparent;white-space:nowrap;min-height:36px;padding:6px 10px;}
.reader-tab[aria-selected="true"],.reader-toolbar button[aria-pressed="true"] {background:var(--dbc-tint);color:var(--dbc-accent);border-color:var(--dbc-border);}
.reader-toolbar {min-width:0;padding:8px 18px;border-bottom:1px solid var(--dbc-line);background:var(--dbc-soft);}
.reader-toolbar-meta {display:flex;align-items:center;gap:10px;min-width:0;}
.reader-content-type {font-size:13px;line-height:1.5;flex:0 0 auto;}
.reader-source-path {font:12px/1.5 ui-monospace,monospace;color:var(--dbc-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.reader-toolbar-actions {display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.reader-toolbar-actions button {font-size:12px;min-height:34px;padding:5px 8px;}
.reader-source-choice {display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--dbc-muted);}
.reader-source-select {min-width:0;width:100%;max-width:100%;font:12px/1.5 ui-monospace,monospace;color:var(--dbc-fg);background:var(--dbc-surface);padding:5px;border:1px solid var(--dbc-border);border-radius:5px;}
.reader-copy-feedback {margin:3px 0 0;font-size:12px;line-height:1.4;color:var(--dbc-muted);}
.reader-copy-feedback:empty {display:none;}
.reader-meta {font-size:12px;line-height:1.6;color:var(--dbc-muted);}
.db-plan-content pre.raw-prompt,.reader-manual pre.raw-prompt {white-space:pre-wrap;overflow-wrap:anywhere;overflow:visible;min-height:0;max-height:none;margin:0;padding:0;border:0;background:transparent;font:13px/1.7 ui-monospace,monospace;}
.structured-fields .field-group {margin:18px 0;}
.structured-fields .field-group>h2 {font-size:14px;line-height:1.5;margin:12px 0 8px;}
.structured-fields :is(dt,dd) {font-size:13px;}
.structured-fields .field-value {white-space:pre-wrap;overflow-wrap:anywhere;}
.structured-fields .field-type {display:block;font:11px/1.5 ui-monospace,monospace;color:var(--dbc-muted);}
.structured-fields>section>ol>li+li {border-top:1px solid var(--dbc-line);padding-top:10px;}
.source-details h2 {font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;}
.reader-manual .raw-prompt {margin-top:10px;}
.db-plan-dialog[data-compact="true"] .reader-tabs {padding:3px 7px;gap:1px;}
.db-plan-dialog[data-compact="true"] .reader-toolbar {padding:4px 10px;}
.db-plan-dialog[data-compact="true"] .reader-toolbar-actions {margin-top:2px;gap:3px;}
.db-plan-dialog[data-compact="true"] .reader-toolbar-meta {gap:6px;}
/* The existing technical dialog keeps its real copy handlers and safe fields. */
#debug { width: min(660px, calc(100vw - 32px)); max-height: min(560px, calc(100dvh - 32px)); padding: 0; margin: auto; border: 1px solid var(--dbc-border); border-radius: 16px; overflow: hidden; color: var(--dbc-fg); background: var(--dbc-surface); box-shadow: var(--dbc-modal-shadow); font: 14px/1.6 system-ui, sans-serif; }
#debug[open] { display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
.dbc-debug-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 19px; border-bottom: 1px solid var(--dbc-line); }
#debug h2 { font-size: 16px; display: flex; align-items: center; gap: 9px; }
#debug #debug-close { padding: 0; min-height: 32px; width: 32px; border-color: transparent; font-size: 24px; font-weight: 400; }
.dbc-debug-body { min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 15px 19px; }
#debug-text { display: block; width: 100%; height: 290px; min-height: 100px; resize: vertical; padding: 12px; border: 1px solid var(--dbc-border); border-radius: 9px; color: var(--dbc-fg); background: var(--dbc-soft); font: 12px/1.6 ui-monospace, monospace; }
.dbc-debug-footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 19px; border-top: 1px solid var(--dbc-line); }
#debug-feedback { color: var(--dbc-muted); font-size: 12px; }
@media (max-width: 540px) {
  body.dbc-surface { padding: 10px; }
  #db-confirmation-shell { border-radius: 15px; }
  #db-confirmation-shell > #root.dbc-content { padding: 20px 18px 19px; }
  .dbc-header { gap: 11px; margin-bottom: 21px; }
  .dbc-header-controls { gap: 7px; }
  .dbc-brand { font-size: 16px; }
  .dbc-status { max-width: 145px; font-size: 11px; }
  #db-confirmation-shell h1 { font-size: 19px; }
  .dbc-callout, .dbc-config { padding: 15px; }
  .dbc-config-content { margin-left: 0; }
  .dbc-fields { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .dbc-footer { gap: 12px; }
  .dbc-primary-actions { width: 100%; margin-inline-start: 0; }
