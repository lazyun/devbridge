<script>
(()=>{'use strict';

const decisionRequests=new Map();
const pending=new Map(),runDetails=new Map(),terminalHandoffs=new Set(),root=document.getElementById('root');

// Versioned full SHA-256 IDs remain stable across retries, sessions and mounts.
// A rejected request contributes to a deterministic retry chain only after an
// exact, definitive conflict. An unknown outcome must retain its original ID.
async function decisionRequestId(decisionId,option,rejectedRequestId=''){
const key=JSON.stringify([text(decisionId),text(option)]);
if(!rejectedRequestId&&decisionRequests.has(key))return decisionRequests.get(key);
const canonical=JSON.stringify(['devbridge-decision-card-v2',text(decisionId),text(option),rejectedRequestId]);
const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical));
const id='card-v2-'+Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')+'-'+option.toLowerCase();
decisionRequests.set(key,id);return id
}
function decisionReceipt(resolution,decisionId,option=''){
const receipt=resolution&&resolution.resolutionReceipt;

}
function planReceipt(v,decisionId){const receipt=decisionReceipt(v.resolution,decisionId),option=({APPLIED:'CONFIRM',CONFIRMED:'CONFIRM',REJECTED:'CANCEL'})[v.status];return receipt&&decisionId==='TASK_CONFIRMATION:'+v.id&&receipt.option===option?receipt:null}

function actions(card,defs){const negative=defs.filter(d=>d.intent==='negative'),positive=defs.filter(d=>d.intent==='positive');if(!negative.length&&!positive.length)return;const group=(cls,items)=>{const box=el('div','action-group '+cls);items.forEach(d=>{const b=el('button',d.className||'',d.label);b.onclick=()=>act(b,d);box.append(b)});return box},bar=el('div','action-row');bar.append(group('negative-actions',negative),group('positive-actions',positive));card.append(bar)}
function canMessage(){return !!(hostCapabilities&&hostCapabilities.message)}
function semantic(kind,v){if(!canMessage())return Promise.reject(new Error('This host does not advertise MCP Apps message support. Send a normal chat message to continue.'));let prompt='';if(kind==='scope'){prompt='The user explicitly '+(v.status==='ALLOWED'?'allowed':'rejected')+' the pending scope expansion. Re-evaluate the same FeatureArea Review using that exact decision and preserve all unrelated requirements.'}else if(kind==='summary'){prompt='Summarize the completed Dev Bridge Execution for Task '+text(workflowIdentity.taskPlanId||v.taskId)+'. Treat Bridge Evidence as authoritative and AgentClaim as a non-evidence claim. Do not create Review or Acceptance state.'}else if(kind==='review-success'||kind==='review-failure'){prompt=text(v.message)}return request('ui/message',{role:'user',content:[{type:'text',text:prompt.slice(0,1024)}]})}
function submissionState(value,message){const old=root.querySelector('.submission-state');if(old)old.remove();const card=root.querySelector('.card');if(card)card.append(el('div','notice submission-state',value+(message?' · '+message:'')));syncSize('submission-'+value)}
async function act(button,def){
stopPolling();const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);button.textContent='Submitting…';submissionState('SUBMITTING','Recording the durable Decision.');let submitted=false;
try{
if(def.semanticOnly){await semantic(def.semanticOnly,def.value);button.textContent='Sent to GPT';return}
if(typeof def.args.requestId==='function')def.args.requestId=await def.args.requestId();
submitted=true;const result=await request('tools/call',{name:def.tool,arguments:def.args},15000);

const value=result.structuredContent;
if(def.tool==='ui_approval_decide'){const expected='RUNTIME_APPROVAL:'+def.args.approvalId;if(value.guarantee!=='AUTHORITATIVE_ENTITY_STATE'||!value.entityDecision||value.entityDecision.decisionId!==expected)throw new Error('The response does not identify this exact Decision subject.')}
current=value;render(current);submitted=false;if(value.entityDecision&&value.entityDecision.conflict)showNotice('The subject already has a different recorded choice. Your requested option was not applied.');if(value.entityDecision&&value.entityDecision.transitionError)showNotice('The recorded choice is shown, but runtime handoff or delivery is not proven: '+text(value.entityDecision.transitionError));if(value.workflowRefreshRequired)showNotice('The choice is recorded. Refresh workflow state to inspect runtime progress.');if(def.semanticAfter)await semantic(def.semanticAfter,projection(current))
}catch(error){const unknown=!!(error&&error.outcomeUnknown)||submitted;button.textContent=unknown?'Retry':'Try again';submissionState(unknown?'OUTCOME_UNKNOWN':'FAILED',unknown?'The outcome is unknown. Retry uses the same Decision identity; already-recorded choices are read without repeating runtime handoff or delivery.':text(error&&error.message||error));buttons.forEach(b=>b.disabled=unknown&&b!==button)}
}
function shell(kind,title,status,compact=false){root.textContent='';const card=el('section','card'+(compact?' compact':''));card.append(el('div','eyebrow',kind),el('div','title',title));if(status)card.append(el('span','status',status));root.append(card);return card}
function plan(v){stopPolling();compactNotice('Task plans are internal records. Open the Task to inspect its current phase.')}
function resolvedDecision(v){stopPolling();const resolution=v.resolution||{},receipt=decisionReceipt(resolution,v.decisionId);if(!receipt){compactNotice('The response does not prove this exact Decision resolved. Refresh its durable state.');return}const card=shell('TASK DECISION','Decision recorded','Resolved · '+text(receipt.option),true);fields(card,[['Durable result',text(receipt.resultKind)+' · '+text(receipt.resultId)],['Status',resolution.message||'The authoritative workflow state can be refreshed safely.']]);details(card,[],[['DecisionID',v.decisionId||receipt.decisionId],['RequestID',receipt.requestId],['Resolved at',receipt.resolvedAt]])}
function productTask(v){plan({id:v.id,aiSessionId:workflowIdentity.aiSessionId||input.aiSessionId,taskId:v.id,title:v.title,status:v.status,workSpec:{goal:v.goal,constraints:v.constraints||[],codexInstruction:v.implementationInstruction,executionScope:v.executionScope},verificationSpec:v.verificationSpec})}
function proposal(v){stopPolling();const actionable=false,goal=v.workSpec&&v.workSpec.goal||'Confirmed implementation',card=shell('EXECUTION',actionable?'READY TO EXECUTE':preview(goal,100),humanStatus(v.status),!actionable);fields(card,[['Scope',scopeSummary(v.workSpec&&v.workSpec.executionScope)],['Implementation',preview(goal,180),true],['Verification',verificationSummary(v.verificationSpec)]]);details(card,[['Files',scopePaths(v.workSpec&&v.workSpec.executionScope)],['Constraints',(v.workSpec&&v.workSpec.constraints||[]).join('\n')||'None'],['Verification',verificationDetails(v.verificationSpec)]],[['TaskID',v.taskId],['TaskPlanID',v.taskPlanId],['ExecutionProposalID',v.id],['Status',v.status]])}

function runDetailRows(v){return[['Changed files',(v.changedFiles||[]).join('\n')||'None'],['Verification Report',verificationReportDetails(v.verificationReport)],['Failure',v.failure&&(v.failure.code+' · '+(v.failure.message||v.failure.summary||''))],['AgentClaim',v.agentClaim||'None (not Evidence)'],['Evidence',evidenceDetails(v.gitEvidence)]]}

function run(v,workflow=null){const terminal=workflow?workflow.terminal:['SUCCEEDED','FAILED','INFRASTRUCTURE_FAILED','CANCELED'].includes(v.status),runTerminal=['SUCCEEDED','FAILED','INFRASTRUCTURE_FAILED','CANCELED'].includes(v.status),scopeReview=v.purpose==='SCOPE_REVIEW',taskDone=terminal&&!scopeReview,title=scopeReview?(terminal?'Feature Area Review complete':'Feature Area Review'):taskDone?'RESULT':'EXECUTION',card=shell(title,runTitle(v),stateLabel(workflow?workflow.phase:v.status),taskDone||(scopeReview&&terminal));const stageBox=el('div','stages');if(workflow){if(workflow.reviewId)stage(stageBox,'Feature Area Review',stateLabel(v.status),stageClass(v.status));stage(stageBox,'Implementation',stateLabel(workflow.implementation.status),stageClass(workflow.implementation.status));stage(stageBox,'Verification',stateLabel(workflow.verification.status),stageClass(workflow.verification.status))}else if(scopeReview){stage(stageBox,'Feature Area Review',stateLabel(v.status),stageClass(v.status));stage(stageBox,'Implementation','Waiting','wait');stage(stageBox,'Verification','Waiting','wait')}else if(v.purpose==='VERIFICATION'){stage(stageBox,'Implementation','Complete','ok');stage(stageBox,'Verification',stateLabel(v.status),stageClass(v.status))}else{stage(stageBox,'Implementation',stateLabel(v.status),stageClass(v.status));stage(stageBox,'Verification',terminal?(v.status==='SUCCEEDED'?'Complete or waived':'Not completed'):'Waiting',terminal&&v.status==='SUCCEEDED'?'ok':'wait')}card.append(stageBox);if(workflow&&workflow.agentExecution){const e=workflow.agentExecution;fields(card,[['Execution status',e.status],['Backend disposition',e.backendDisposition]]);if(e.backendDisposition==='UNKNOWN_ORPHANED')card.append(el('p','notice','Bridge authority permanently revoked; workspace and context quarantined. Physical backend termination is not proven.'));}const changed=workflow?workflow.changedFileCount:(v.changedFiles||[]).length;if(changed)card.append(el('div','changed',changed+' file'+(changed===1?'':'s')+' changed'));const metrics=el('div','metrics');if(v.durationMillis!=null)metrics.append(el('span','',formatDuration(v.durationMillis)));if(v.tokenUsage&&v.tokenUsage.status==='AVAILABLE'&&v.tokenUsage.usage)metrics.append(el('span','',formatTokens(v.tokenUsage.usage.totalTokens)+' tokens'));else metrics.append(el('span','',v.tokenUsage&&v.tokenUsage.status==='PENDING'?'Token usage pending':'Token usage unavailable'));if(metrics.childNodes.length)card.append(metrics);if(taskDone&&canMessage())actions(card,[{intent:'positive',label:'Ask GPT to summarize',semanticOnly:'summary',value:v}]);else if(!scopeReview&&!terminal&&!runTerminal&&v.status!=='WAITING_APPROVAL'&&!(workflow&&workflow.agentExecution))card.append(el('p','notice','To cancel this Execution, ask in chat.'));const detail=runDetails.get(v.id)||v;details(card,runDetailRows(detail),runDiagnostics(detail));if(terminal)stopPolling();else ensurePolling()}
function productReview(v){const p=v.review||{},blocked=p.state==='BLOCKED',terminal=['SUCCEEDED','FAILED','BLOCKED','CANCELED'].includes(p.state),card=shell('REVIEW',blocked?'Feature Area Review blocked':'Feature Area Review',stateLabel(p.state),terminal);fields(card,[['Summary',p.summary],['Focus',p.focus&&p.focus.summary]]);details(card,[['Primary focus',(p.focus&&p.focus.primaryModules||[]).join('\n')],['Supporting focus',(p.focus&&p.focus.supportingModules||[]).join('\n')],['Production roots',(p.focus&&p.focus.productionRoots||[]).join('\n')],['Blockers',(p.blockers||[]).join('\n')],['Recovery',p.recovery]],[['ReviewID',p.id],['FeatureAreaID',p.featureArea&&p.featureArea.id]]);if(terminal)stopPolling();else ensurePolling()}
function stage(box,name,state,cls){const line=el('div','stage');line.append(el('span','',name),el('span','stage-state '+cls,state));box.append(line)}
function projection(data){if(data&&data.scopeExpansion)return data.scopeExpansion;if(data&&data.approval)return data.approval;return data}
function handoffScopeReview(v){const active=v&&v.currentRun,status=active&&active.status,terminal=['SUCCEEDED','FAILED','INFRASTRUCTURE_FAILED','CANCELED'].includes(status),continuation=v&&v.continuation;if(!active||active.purpose!=='SCOPE_REVIEW'||!terminal||!continuation||continuation.attempt!==true)return;const key=continuation.featureAreaId+'|'+continuation.reviewId+'|'+continuation.runId+'|'+continuation.kind;if(terminalHandoffs.has(key))return;terminalHandoffs.add(key);stopPolling();syncSize('scope-review-handoff');if(!canMessage()){showNotice('Feature Area Review is complete. Send a normal chat message to continue planning.');return}const kind=continuation.kind==='REVIEW_SUCCEEDED'?'review-success':'review-failure';semantic(kind,continuation).catch(error=>showNotice('Planning handoff could not be sent. '+text(error&&error.message||error)))}
function workflow(v){if(v.scopeExpansion){expansion(v.scopeExpansion);return}if(v.approval&&v.approval.pending){approval(v.approval,true,v.reviewId?'REVIEW':'EXECUTION');return}if(v.executionProposal){proposal(v.executionProposal);return}if(v.taskPlan){plan(v.taskPlan);return}if(!v.currentRun){compactNotice(v.agentExecution?stateLabel(v.agentExecution.status):'Workflow state is not actionable.');return}const value={executionId:v.executionId,id:v.currentRun.id,taskId:v.task&&v.task.id,purpose:v.currentRun.purpose,status:v.currentRun.status,executionProposalId:v.executionProposalId,failure:v.failure};run(value,v);handoffScopeReview(v)}
function rememberIdentity(data){const next=Object.assign({},workflowIdentity),planValue=data&&data.taskPlan,proposalValue=data&&data.executionProposal,runValue=data&&data.run,reviewValue=data&&data.review;if(data&&data.aiSessionId)next.aiSessionId=data.aiSessionId;if(input.aiSessionId)next.aiSessionId=input.aiSessionId;if(reviewValue){next.taskId="";next.taskPlanId="";next.executionProposalId="";next.runId="";next.reviewId=reviewValue.id||next.reviewId;if(reviewValue.featureArea&&reviewValue.featureArea.id)next.featureAreaId=reviewValue.featureArea.id}if(data&&data.reviewId){next.reviewId=data.reviewId;if(!data.task){next.taskId="";next.taskPlanId="";next.executionProposalId="";next.runId=""}};if(data&&data.featureArea&&data.featureArea.id)next.featureAreaId=data.featureArea.id;if(data&&data.featureAreaId)next.featureAreaId=data.featureAreaId;if(data&&data.executionScope&&data.verificationSpec){next.taskPlanId=data.id}if(data&&data.task&&data.phase)next.taskId=data.task.id;if(data&&data.taskId)next.taskId=data.taskId;if(planValue){next.aiSessionId=planValue.aiSessionId||next.aiSessionId;next.taskId=planValue.taskId;next.taskPlanId=planValue.id}if(proposalValue){next.aiSessionId=proposalValue.aiSessionId||next.aiSessionId;next.taskId=proposalValue.taskId;next.taskPlanId=proposalValue.taskPlanId;next.executionProposalId=proposalValue.id}if(runValue){next.taskId=runValue.taskId;next.executionProposalId=runValue.executionProposalId||next.executionProposalId;next.runId=runValue.id}else if(data&&data.purpose&&data.taskId){next.taskId=data.taskId;next.executionProposalId=data.executionProposalId||next.executionProposalId;next.runId=data.id}if(data&&data.phase){next.taskPlanId=data.taskPlanId||"";next.executionProposalId=data.executionProposalId||"";next.runId=data.currentRun&&data.currentRun.id||""}if(next.taskId)next.reviewId="";const oldKey=identityKey(workflowIdentity),newKey=identityKey(next);workflowIdentity=next;if(oldKey&&newKey!==oldKey){if(pollTimer){clearTimeout( function identityKey(v){return[v.aiSessionId,v.featureAreaId,v.reviewId,v.taskId,v.taskPlanId,v.executionProposalId,v.runId].join('|')}
async function hydratePublicDecision(data){stopPolling();compactNotice('Open the Task card to inspect its current review gate or acceptance decision.')}
function render(data){if(tornDown)return;if(typeof data==='string'){try{data=JSON.parse(data)}catch(_){}}if(!data||typeof data!=='object'){compactNotice('No decision or progress data.');return}rememberIdentity(data);if(data.currentState||data.pendingDecision!==undefined&&data.current){hydratePublicDecision(data);return}if(data.decisionState){if(data.taskPlan&&data.taskPlan.id)plan(Object.assign({},data.taskPlan,{decisionId:data.decisionId,resolution:data.resolution,requestIds:data.requestIds}));else if(data.decisionState==='RESOLVED'&&data.resolution)resolvedDecision(data);else compactNotice('Decision detail is temporarily unavailable.');syncSize('render');return}if(data.run&&data.run.id)runDetails.set(data.run.id,data.run);else if(data.purpose&&data.status&&data.id)runDetails.set(data.id,data);if(data.review&&data.review.featureArea)productReview(data);else if(data.featureAreaId&&data.executionScope&&data.verificationSpec)productTask(data);else if(data.phase&&(data.task||data.reviewId))workflow(data);else if(data.executionProposal&&data.run)run(data.run);else if(data.approval&&data.run)run(data.run);else if(data.executionProposal)proposal(data.executionProposal);else if(data.taskPlan)plan(data.taskPlan);else if(data.scopeExpansion)expansion(data.scopeExpansion);else if(data.approval)approval(data.approval);else if(data.run)run(data.run);else if(data.approvals)data.approvals.length?approval(data.approvals[0]):compactNotice('No pending runtime approval.');else if(data.taskId&&data.workSpec&&data.taskPlanId)proposal(data);else if(data.taskId&&data.workSpec&&data.verificationSpec&&data.id)plan(data);else if(data.allowedDecisions)approval(data);else if(data.currentScope&&data.additionalScope)expansion(data);else if(data.purpose&&data.status)run(data);else compactNotice('No interactive Dev Bridge decision is required for this result.');syncSize('render')}
function ensurePolling(){if(tornDown||!workflowIdentity.aiSessionId||(!workflowIdentity.taskId&&!workflowIdentity.reviewId)){stopPolling();return}pollingActive=true;const key=identityKey(workflowIdentity);if(pollIdentity&&pollIdentity!==key){if(pollTimer){clearTimeout(pollTimer);pollTimer=null}pollGeneration++}pollIdentity=key;if(pollTimer||pollInFlight)return;pollTimer=setTimeout(pollWorkflow,2500)}
async function pollWorkflow(){pollTimer=null;if(tornDown||!pollingActive)return;const generation=pollGeneration,args={aiSessionId:workflowIdentity.aiSessionId};if(workflowIdentity.reviewId)args.reviewId=workflowIdentity.reviewId;if(workflowIdentity.taskId)args.taskId=workflowIdentity.taskId;if(workflowIdentity.taskPlanId)args.taskPlanId=workflowIdentity.taskPlanId;if(workflowIdentity.executionProposalId)args.executionProposalId=workflowIdentity.executionProposalId;if(workflowIdentity.runId)args.runId=workflowIdentity.runId;pollInFlight=true;try{const result=await request('tools/call',{name:'ui_workflow_state_get',arguments:args}),value=result&&result.structuredContent;if(tornDown||generation!==pollGeneration)return;if(!value||(!value.task&&!value.reviewId)||(workflowIdentity.taskId&&(!value.task||value.task.id!==workflowIdentity.taskId))||(workflowIdentity.reviewId&&value.reviewId!==workflowIdentity.reviewId))throw new Error('stale workflow state');current=value;render(value)}catch(error){if(!tornDown&&generation===pollGeneration){stopPolling();compactNotice('Workflow progress is no longer available.')}}finally{pollInFlight=false;if(pollingActive&&!tornDown)ensurePolling()}}
function stopPolling(){pollingActive=false;pollGeneration++;pollIdentity='';if(pollTimer){clearTimeout(pollTimer);pollTimer=null}}
function scopeSummary(v){if(!v)return'Not specified';if(v.kind==='REPOSITORY')return'Entire repository';const paths=v.paths||[],groups={};paths.forEach(p=>{const key=text(p).split('/')[0]||'.';groups[key]=(groups[key]||0)+1});const names=Object.keys(groups),shown=names.slice(0,4).map(k=>'• '+k+' ('+groups[k]+')');if(names.length>4)shown.push('• +'+(names.length-4)+' more groups');return shown.join('\n')||v.kind||'Not specified'}
function scopePaths(v){if(!v)return'Not specified';return v.kind==='REPOSITORY'?'Entire repository':(v.paths||[]).join('\n')||'None'}
function keyConstraints(values){const constraints=values||[],shown=constraints.slice(0,3).map(v=>'• '+preview(v,110));if(constraints.length>3)shown.push('• +'+(constraints.length-3)+' more');return shown.join('\n')||'None'}
function verificationSummary(v){if(!v)return'Not specified';if(v.mode==='NONE')return'Waived: '+preview(v.waiver&&v.waiver.reason,120);return text(v.checkCount!=null?v.checkCount:(v.checks||[]).length)+' checks · '+text((v.acceptanceCriteria||[]).length)+' acceptance criteria'}
function verificationDetails(v){if(!v)return'Not specified';if(v.mode==='NONE')return verificationSummary(v);return(v.checks||[]).map((c,i)=>(i+1)+'. '+c.kind+(c.command?' · '+c.command:c.instruction?' · '+c.instruction:'')).join('\n')||v.scope||'Checks available in the confirmed Task'}
function verificationReportDetails(v){if(!v)return'';const checks=(v.checks||[]).map(c=>{const fact=c.observed||c.reported||c;return(c.index+1)+'. '+c.kind+' · '+(c.observed?'Bridge observed':'Agent reported')+' · '+(fact.status||'UNKNOWN')+(fact.summary?' · '+fact.summary:'')}).join('\n');return'v'+v.version+' · '+v.availability+' · '+v.checkCount+' checks'+(v.summary?' · '+v.summary:'')+(checks?'\n'+checks:'')}
function evidenceDetails(v){if(!v)return'';return'Changed files: '+(v.changedFiles||[]).length+'\nDirty: '+text(v.dirty)+'\nDiff artifact: '+text(v.diffArtifactId||'None')}
function safeRequest(v){if(v==null)return'';if(typeof v==='string')return v.slice(0,2048);try{return JSON.stringify(v,null,2).slice(0,2048)}catch(_){return'Bounded request details unavailable'}}
function planTitle(v){return v==='REJECTED'?'Canceled task':'TASK'}
function humanStatus(v){return({PENDING_CONFIRMATION:'Awaiting confirmation',PENDING:'Awaiting decision',APPLIED:'Plan confirmed',REJECTED:'Rejected',CONFIRMED:'Confirmed',CONSUMED:'Execution authorized',ALLOWED:'Allowed',DECIDED:'Decision recorded',DELIVERED:'Delivered'}[v]||stateLabel(v))}
function stateLabel(v){return({WAITING:'Waiting',WAIVED:'Waived',NOT_COMPLETED:'Not completed',CREATED:'Starting',PREPARING:'Starting',RUNNING:'Running',WAITING_APPROVAL:'Waiting for approval',COLLECTING:'Collecting results',SUCCEEDED:'Complete',FAILED:'Failed',INFRASTRUCTURE_FAILED:'Infrastructure failed',CANCELED:'Canceled'}[v]||v)}
function stageClass(v){return v==='SUCCEEDED'?'ok':['FAILED','INFRASTRUCTURE_FAILED','CANCELED'].includes(v)?'':'active'}
function runTitle(v){return v.purpose==='VERIFICATION'?'Verification':v.purpose==='SCOPE_REVIEW'?'Reviewing scope':'Implementation'}
function formatDuration(ms){if(ms<1000)return ms+' ms';if(ms<60000)return(Math.round(ms/100)/10)+' s';return(Math.round(ms/6000)/10)+' min'}
function formatTokens(value){return value>=1000?(Math.round(value/100)/10)+'k':text(value)}
function compactNotice(message){stopPolling();root.replaceChildren(el('div','statusline',message));syncSize('compact-state')}
function showNotice(message){let card=root.querySelector('.card');if(!card){card=el('section','card compact');root.replaceChildren(card)}card.append(el('div','notice',message));syncSize('notice')}
function measuredContentSize(){const rootRect=root.getBoundingClientRect(),bodyStyle=getComputedStyle(document.body),paddingTop=parseFloat(bodyStyle.paddingTop)||0,paddingBottom=parseFloat(bodyStyle.paddingBottom)||0;return{width:Math.ceil(rootRect.width),height:Math.ceil(rootRect.height+paddingTop+paddingBottom)}}
function syncSize(reason){if(tornDown||!initialized)return;if(resizeFrame!=null)cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{resizeFrame=requestAnimationFrame(()=>{resizeFrame=null;if(!tornDown)notify('ui/notifications/size-changed',measuredContentSize())})})}
function teardown(){tornDown=true;stopPolling();if(resizeFrame!=null){cancelAnimationFrame(resizeFrame);resizeFrame=null}if(resizeObserver){resizeObserver.disconnect();resizeObserver=null}}
addEventListener('message',event=>{const d=event.data;if(!d||d.jsonrpc!=='2.0')return;if(d.id!=null&&pending.has(d.id)){const p=pending.get(d.id);pending.delete(d.id);if(p.timer)clearTimeout(p.timer);d.error?p.reject(new Error(d.error.message||'request failed')):p.resolve(d.result);return}if(d.method==='ui/notifications/tool-input'){input=d.params&&d.params.arguments||{};rememberIdentity(input)}if(d.method==='ui/notifications/tool-result'){current=d.params&&d.params.structuredContent;render(current)}if(d.method==='ui/notifications/host-context-changed'&&d.params&&d.params.theme){document.documentElement.style.colorScheme=d.params.theme;syncSize('host-context')}if(d.method==='ui/resource-teardown'&&d.id!=null){teardown();parent.postMessage({jsonrpc:'2.0',id:d.id,result:{}},'*')}});
addEventListener('pagehide',teardown,{once:true});
request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'devbridge-decision-card',version:'1.4.0'},appCapabilities:{availableDisplayModes:['inline']}}).then(r=>{hostCapabilities=r&&r.hostCapabilities||{};if(r&&r.hostContext&&r.hostContext.theme)document.documentElement.style.colorScheme=r.hostContext.theme;initialized=true;notify('ui/notifications/initialized',{});resizeObserver=new ResizeObserver(()=>syncSize('content-resize'));resizeObserver.observe(root);if(current)render(current);syncSize('initial-render')}).catch(e=>showNotice('Interactive host initialization unavailable: '+text(e&&e.message||e)));
})();
</script></body></html>
