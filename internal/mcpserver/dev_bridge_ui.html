      attach:(readFacts,sanitizeError)=>protect(()=>{provider=readFacts;errorSummary=sanitizeError;paint();}),
      hashMainScript:source=>protect(()=>{
        if(!CARD_DEBUG_ENABLED||typeof source!=='string')return;
        state.resource.mainScriptSource='current executing inline script text; NOT whole HTML or server binary';
        if(!globalThis.crypto?.subtle||typeof TextEncoder!=='function'){paint();return;}
        Promise.resolve().then(()=>crypto.subtle.digest('SHA-256',new TextEncoder().encode(source))).then(bytes=>protect(()=>{state.resource.mainScriptSHA256=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');record('MAIN_SCRIPT_HASHED');})).catch(()=>protect(()=>{state.resource.mainScriptSHA256='UNKNOWN';paint();}));
      })
    };
    window.addEventListener('error',onError);window.addEventListener('unhandledrejection',onRejection);document.addEventListener('visibilitychange',onVisibility);window.addEventListener('pagehide',close);

    copy.onclick=()=>protect(()=>{const value=serialized();if(!navigator.clipboard?.writeText){copy.textContent='请手动选择 DEBUG 文本';return;}Promise.resolve(navigator.clipboard.writeText(value)).then(()=>protect(()=>{copy.textContent='已复制 DEBUG';})).catch(()=>protect(()=>{copy.textContent='请手动选择 DEBUG 文本';}));});
